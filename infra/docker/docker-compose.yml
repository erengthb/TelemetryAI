version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: telemetryai-postgres
    environment:
      POSTGRES_USER: telemetryai
      POSTGRES_PASSWORD: telemetryai
      POSTGRES_DB: telemetryai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: telemetryai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@telemetryai.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
