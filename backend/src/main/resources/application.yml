server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/telemetryai}
    username: ${DB_USER:telemetryai}
    password: ${DB_PASSWORD:telemetryai}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod}
    ttlMinutes: ${JWT_TTL_MINUTES:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info
