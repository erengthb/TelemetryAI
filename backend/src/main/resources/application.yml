spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/telemetryai}
    username: ${DB_USER:telemetryai}
    password: ${DB_PASSWORD:telemetryai}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:telemetryai-dev-secret-32-chars-minimum!!}
    ttlMinutes: ${JWT_TTL_MINUTES:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info

telemetryai:
  jobs:
    aggregation:
      cron: ${AGGREGATION_CRON:0 0 2 * * *}
      lookbackDays: ${AGGREGATION_LOOKBACK_DAYS:1}
    ai:
      dailyCron: ${AI_DAILY_CRON:0 0 3 * * *}
      weeklyCron: ${AI_WEEKLY_CRON:0 0 4 * * MON}
      lookbackDays: ${AI_LOOKBACK_DAYS:1}

openai:
  apiKey: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:oai-5.2}
  temperature: ${OPENAI_TEMPERATURE:0.2}
